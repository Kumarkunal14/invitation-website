<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>|| श्री सत्यनारायण कथा ||</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Three.js 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Canvas Confetti for Pushpanjali Petals -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Yatra+One&family=Rozha+One&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Tiro Devanagari Hindi', serif;
      background-color: #120205;
      color: #fff;
      overflow-x: hidden;
    }
    .font-hindi-heading {
      font-family: 'Yatra One', 'Rozha One', cursive;
    }
    .font-royal {
      font-family: 'Cinzel', serif;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF6D3 0%, #FFD700 35%, #FFA500 70%, #C59B27 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(26, 5, 8, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(212, 175, 55, 0.1);
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
      50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
    }
    .pulse-gold {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="selection:bg-amber-500 selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 3D Falling Flower Petals Scene ---
    const Canvas3DBackground = () => {
      const mountRef = useRef(null);

      useEffect(() => {
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        if (mountRef.current) {
          mountRef.current.appendChild(renderer.domElement);
        }

        const petalCount = 45;
        const petals = [];
        const petalGeometry = new THREE.PlaneGeometry(0.35, 0.5);
        const colors = [0xFF9900, 0xFF6600, 0xCC0000, 0xFFD700];

        for (let i = 0; i < petalCount; i++) {
          const color = colors[Math.floor(Math.random() * colors.length)];
          const material = new THREE.MeshBasicMaterial({
            color: color,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.85
          });
          
          const mesh = new THREE.Mesh(petalGeometry, material);
          mesh.position.set(
            (Math.random() - 0.5) * 25,
            Math.random() * 20 - 10,
            (Math.random() - 0.5) * 15
          );
          mesh.rotation.set(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            Math.random() * Math.PI
          );
          
          const speed = 0.02 + Math.random() * 0.03;
          const rotSpeed = (Math.random() - 0.5) * 0.02;

          petals.push({ mesh, speed, rotSpeed });
          scene.add(mesh);
        }

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          petals.forEach(p => {
            p.mesh.position.y -= p.speed;
            p.mesh.rotation.x += p.rotSpeed;
            p.mesh.rotation.y += p.rotSpeed;

            if (p.mesh.position.y < -12) {
              p.mesh.position.y = 12;
              p.mesh.position.x = (Math.random() - 0.5) * 25;
            }
          });

          renderer.render(scene, camera);
        };

        animate();

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };

        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (mountRef.current && renderer.domElement) {
            mountRef.current.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} className="fixed inset-0 pointer-events-none z-0" />;
    };

    // --- Voice Speaker Button Component ---
    const DivineSpeechSpeaker = () => {
      const [isSpeaking, setIsSpeaking] = useState(false);

      const handleSpeech = () => {
        if (!('speechSynthesis' in window)) {
          alert("आपके ब्राउज़र में बोलकर सुनाने की सुविधा उपलब्ध नहीं है।");
          return;
        }

        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }

        const textToSpeak = `
          श्री गणेशाय नमः। 
          श्री सत्यनारायण कथा का सहर्ष आमंत्रण।
          परम पिता परमेश्वर की असीम कृपा से हमारे गृह पर श्री सत्यनारायण व्रत कथा का आयोजन किया गया है।
          दिनांक: सोमवार, 23 नवंबर 2026, समय: संध्या 3 बजे से।
          स्थान: बाईपास कृष्णा निकेतन स्कूल रोड, जकरियापुर, वृन्दावन कॉलोनी रोड नंबर 7बी, आर. जे. सुपरमार्केट के पास।
          आप सभी सपरिवार इस पावन अवसर पर पधारकर कथा एवं प्रसाद ग्रहण करें।
        `;

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'hi-IN';
        utterance.rate = 0.88;

        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);

        setIsSpeaking(true);
        window.speechSynthesis.speak(utterance);
      };

      return (
        <button
          onClick={handleSpeech}
          className={`px-4 py-2.5 rounded-full glass-card border border-amber-400/50 flex items-center gap-2 text-amber-200 hover:text-white transition-all shadow-lg active:scale-95 ${isSpeaking ? 'ring-2 ring-amber-400 animate-pulse bg-amber-900/40' : ''}`}
        >
          <span className="text-xl">{isSpeaking ? '🔊' : '🗣️'}</span>
          <span className="text-sm font-semibold">
            {isSpeaking ? 'बोलना बंद करें' : '🔊 निमंत्रण बोलकर सुनें'}
          </span>
        </button>
      );
    };

    // --- Countdown Timer Component ---
    const CountdownTimer = () => {
      const targetDate = new Date('2026-11-23T15:00:00+05:30').getTime();
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date().getTime();
          const difference = targetDate - now;

          if (difference > 0) {
            setTimeLeft({
              days: Math.floor(difference / (1000 * 60 * 60 * 24)),
              hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
              minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
              seconds: Math.floor((difference % (1000 * 60)) / 1000)
            });
          }
        }, 1000);

        return () => clearInterval(timer);
      }, []);

      return (
        <div className="grid grid-cols-4 gap-2 sm:gap-4 my-6 max-w-md mx-auto">
          {[
            { label: 'दिन', val: timeLeft.days },
            { label: 'घंटे', val: timeLeft.hours },
            { label: 'मिनट', val: timeLeft.minutes },
            { label: 'सेकंड', val: timeLeft.seconds },
          ].map((item, idx) => (
            <div key={idx} className="glass-card p-3 rounded-xl text-center border border-amber-500/30">
              <div className="text-2xl sm:text-3xl font-bold font-royal text-amber-300">
                {String(item.val).padStart(2, '0')}
              </div>
              <div className="text-xs text-amber-200/70 mt-1">{item.label}</div>
            </div>
          ))}
        </div>
      );
    };

    // --- Main Invitation App ---
    const App = () => {
      const triggerFlowerBurst = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 120,
            spread: 90,
            origin: { y: 0.6 },
            colors: ['#FFD700', '#FF8C00', '#FF0000', '#FFA500']
          });
        }
      };

      return (
        <div className="min-h-screen relative text-amber-50 selection:bg-amber-500 selection:text-black">
          {/* 3D Background */}
          <Canvas3DBackground />

          {/* Top Bar with Voice Reciter */}
          <div className="relative z-20 p-4 flex justify-between items-center max-w-4xl mx-auto">
            <div className="text-amber-400 font-royal font-bold text-lg tracking-widest">
              || शुभ मुहूर्त ||
            </div>
            <DivineSpeechSpeaker />
          </div>

          {/* Main Card Container */}
          <main className="relative z-10 max-w-3xl mx-auto px-4 py-6 text-center">
            
            {/* Header Motif */}
            <div className="mb-4 inline-block">
              <span className="text-4xl text-amber-400">🕉️</span>
            </div>

            <div className="text-amber-400 font-hindi-heading text-2xl tracking-wide mb-2">
              || श्री गणेशाय नमः ||
            </div>

            {/* Title */}
            <h1 className="text-3xl sm:text-5xl font-hindi-heading gold-gradient-text my-4 leading-relaxed">
              श्री सत्यनारायण कथा 
            </h1>

            <p className="text-amber-200/90 text-lg max-w-xl mx-auto my-4 leading-relaxed">
              परम पिता परमेश्वर की असीम कृपा से हमारे निवास स्थान पर श्री सत्यनारायण कथा एवं पूजन का पावन आयोजन किया गया है।
            </p>

            {/* Shloka Card */}
            <div className="glass-card p-5 rounded-2xl my-6 border border-amber-500/40 max-w-lg mx-auto">
              <p className="text-amber-300 font-serif italic text-base sm:text-lg">
                "नमो ब्रह्मण्य देवाय गोब्राह्मण हिताय च।<br/>
                जगद्धिताय कृष्णाय गोविन्दाय नमो नमः॥"
              </p>
            </div>

            {/* Pushpanjali Button */}
            <div className="my-6">
              <button
                onClick={triggerFlowerBurst}
                className="pulse-gold bg-gradient-to-r from-amber-600 via-amber-500 to-amber-600 text-black font-bold px-8 py-3.5 rounded-full text-lg shadow-xl hover:scale-105 active:scale-95 transition-all duration-300 flex items-center gap-2 mx-auto"
              >
                <span>🌸</span> स्वागत है (welcome) <span>🌸</span>
              </button>
            </div>

            {/* Countdown */}
            <CountdownTimer />

            {/* Program Details Card */}
            <div className="glass-card p-6 sm:p-8 rounded-3xl my-8 border border-amber-500/40 text-left max-w-xl mx-auto space-y-6">
              <h2 className="text-2xl font-hindi-heading text-center gold-gradient-text border-b border-amber-500/30 pb-3">
                शुभ कार्यक्रम
              </h2>

              <div className="flex items-start gap-4">
                <div className="text-2xl p-2 bg-amber-950/60 rounded-xl border border-amber-500/30">📅</div>
                <div>
                  <div className="text-amber-400 text-sm font-semibold">दिनांक एवं तिथि</div>
                  <div className="text-xl font-bold text-white mt-0.5">सोमवार, 23 नवंबर 2026</div>
                </div>
              </div>

              <div className="flex items-start gap-4">
                <div className="text-2xl p-2 bg-amber-950/60 rounded-xl border border-amber-500/30">⏰</div>
                <div>
                  <div className="text-amber-400 text-sm font-semibold">समय</div>
                  <div className="text-xl font-bold text-white mt-0.5">संध्या 03:00 बजे से</div>
                </div>
              </div>

              <div className="flex items-start gap-4">
                <div className="text-2xl p-2 bg-amber-950/60 rounded-xl border border-amber-500/30">📍</div>
                <div>
                  <div className="text-amber-400 text-sm font-semibold">स्थान / पता</div>
                  <div className="text-base font-semibold text-amber-100 mt-1 leading-relaxed">
                    बाईपास कृष्णा निकेतन स्कूल रोड, जकरियापुर, वृन्दावन कॉलोनी रोड नं. 7बी (आर. जे. सुपरमार्केट के पास)
                  </div>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="pt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <a
                  href="https://maps.app.goo.gl/H1tSrq3iLXBwFtuQA"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full py-3 px-4 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/50 flex items-center justify-center gap-2 text-amber-300 font-bold transition-all"
                >
                  📍 मैप पर रास्ता देखें
                </a>
                <a
                  href="tel:+919304575760"
                  className="w-full py-3 px-4 rounded-xl bg-green-600/30 hover:bg-green-600/40 border border-green-500/50 flex items-center justify-center gap-2 text-green-300 font-bold transition-all"
                >
                  📞 संपर्क करें (+91 9334301521)
                </a>
              </div>
            </div>

            {/* Host Section */}
            <div className="my-8 py-6 border-t border-b border-amber-500/30 max-w-xl mx-auto">
              <div className="text-amber-400 font-hindi-heading text-lg mb-2">दर्शनार्थी एवं आकांक्षी</div>
              <div className="text-xl font-bold text-white">समस्त परिवार</div>
              <div className="text-sm text-amber-200/70 mt-1">आपकी गरिमामयी उपस्थिति सहर्ष प्रार्थनीय है।</div>
            </div>

          </main>

          <footer className="relative z-10 text-center py-6 text-xs text-amber-400/60">
            || श्री सत्यनारायणाय नमः ||
          </footer>
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
